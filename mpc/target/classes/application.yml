server:
  port: 8080

spring:
  datasource:
    url: jdbc:mysql://mysql:3306/mpc?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: root
    password: root123
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true

  data:
    redis:
#      host: 127.0.0.1
#改为redis服务器地址
      host: redis #172.19.129.19
      port: 6379
      database: 0
      timeout: 10000ms
      lettuce:
        pool:
          max-active: 8
          max-wait: -1ms
          max-idle: 8
          min-idle: 0

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

mpc:
  jwt:
    secret: mpc-secret-key-for-jwt-token-generation-must-be-at-least-256-bits-long
    expiration: 86400000   # 24h in ms
  upload:
    avatar-dir: /app/uploads/avatars/

logging:
  level:
    com.mpc: DEBUG
    org.springframework.web.socket: DEBUG
